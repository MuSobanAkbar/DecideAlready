<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- 3D Button Base / Bevel -->
  <rect x="0" y="2" width="16" height="14" rx="3" fill="#881337" />
  <!-- Main Button Face -->
  <rect x="0" y="0" width="16" height="14" rx="3" fill="#E11D48" />
  <!-- Top Highlight -->
  <rect x="2" y="1" width="12" height="1" fill="#FB7185" />
  <!-- Pixel-Snapped 'D' (x: 2..7, y: 3..11) -->
