    M2 3 H6 V4 H7 V10 H6 V11 H2 Z
    M4 5 V9 H5 V5 Z
  " />
  <!-- Pixel-Snapped 'A' (x: 9..14, y: 3..11) -->
  <path fill="#FFFFFF" fill-rule="evenodd" d="
    M10 3 H13 V4 H14 V11 H12 V8 H11 V11 H9 V4 H10 Z
    M11 5 V6 H12 V5 Z
  " />
</svg>
